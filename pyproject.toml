[project]
name = "agentic-data-analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.8",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.3.0",
    "langchain-qwq>=0.3.5",
    "openai>=2.41.1",
    "pandas>=3.0.3",
    "yfinance>=1.4.1",
    "plotly>=6.0.0",
    "kaleido>=0.2.1",
    "pyjwt[crypto]>=2.10.0",
    "langchain-redis>=0.2.5",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The agent/workflow suites need a live LLM (DASHSCOPE_API_KEY) or external
# services, so they are excluded from the default offline run used by CI/coverage.
addopts = """\
-q --strict-markers \
--ignore=tests/test_data_collector.py \
--ignore=tests/test_code_generator.py \
--ignore=tests/test_report_generator.py \
--ignore=tests/test_workflow.py\
"""

[tool.coverage.run]
source = ["src", "app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
